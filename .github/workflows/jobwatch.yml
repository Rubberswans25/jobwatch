name: jobwatch

on:
  schedule:
    # every 20 minutes, all day, every day: postings drop at midnight and on weekends too.
    # Off the hour on purpose: GitHub drops a lot of :00 / */20 cron events under load.
    - cron: "8,28,48 * * * *"
    # once a day: find new companies in the internship feeds, then probe new names
    - cron: "38 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # job-level so the `if:` on the drafting step can see it
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Discover new companies from internship feeds (daily)
        if: github.event.schedule == '38 9 * * *'
        run: python jobwatch/discover.py

      - name: Resolve new company names (daily)
        if: github.event.schedule == '38 9 * * *'
        run: python jobwatch/resolve.py --limit 20

      - name: Scan boards
        # writes board errors to the job summary and as warnings; exits non-zero if
        # the scan is mostly broken, so the run goes red and GitHub emails you
        run: python jobwatch/watch.py --ci

      - name: Draft letters for new high scorers
        if: env.ANTHROPIC_API_KEY != ''
        run: python jobwatch/tailor.py --llm --new-only --min-score 55 --hours 2

      - name: Commit results
        run: |
          git config user.name  "jobwatch"
          git config user.email "jobwatch@users.noreply.github.com"
          git add docs/data.json jobwatch/seen.json jobwatch/resolved.json jobwatch/companies.txt
          [ -d drafts ] && git add drafts
          git diff --staged --quiet && exit 0
          git commit -m "jobwatch: $(date -u +%F\ %H:%M) scan"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
